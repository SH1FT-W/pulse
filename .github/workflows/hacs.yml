name: HACS Validation

# Das Repo ist öffentlich: bei jedem Push und Pull Request, dazu wöchentlich
# (HACS ändert seine Anforderungen gelegentlich) und von Hand.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "41 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: HACS Validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: HACS validation
        uses: hacs/action@d556e736723344f83838d08488c983a15381059a # 22.5.0
        with:
          category: integration
          # Icon liegt im Integrationsordner (brand/), HA lädt es seit 2026 lokal
          ignore: brands
