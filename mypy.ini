# Typprüfung: uvx mypy@2.3.1 --python-executable .venv/bin/python (HA kommt aus der Projekt-venv)
[mypy]
python_version = 3.14
files = custom_components/pulse
# Platin der Integration Quality Scale: strict typing
strict = true
show_error_codes = true

# astral (Sonnenstand) liefert keine Typen
[mypy-astral.*]
ignore_missing_imports = true

# HA-Pakete exportieren Teile ihrer Schnittstelle ohne `as` (websocket_api, recorder, http)
[mypy-homeassistant.*]
implicit_reexport = true
