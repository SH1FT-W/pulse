# Python-Lint wie im Frontend Biome: `uvx ruff@0.16.9 check .` / `uvx ruff@0.16.9 format --check .` (Version wie ci.yml)
line-length = 120
target-version = "py313"
# Gemeinsame Vorlage aus mac-werkzeuge, bleibt Zeichen für Zeichen wie dort
extend-exclude = ["tools/pruefe-uebersetzungen.py"]

[lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "ASYNC", "BLE", "LOG", "G", "DTZ", "PT", "RUF", "PIE", "RET", "C4", "PERF"]
# Deutsche Typografie (–, „“) ist gewollt; zusammengesetzte asserts lesen sich in Tests wie ein Satz
ignore = ["RUF001", "RUF002", "RUF003", "PT018"]

[lint.isort]
known-first-party = ["custom_components", "common"]
force-sort-within-sections = true
combine-as-imports = true

[lint.per-file-ignores]
# Testgeräte: Datentabellen bleiben lesbar einzeilig
"dev/**" = ["E501", "PERF401"]
